<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="theme-color" content="#000"/>
<title>J.A.R.V.I.S</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;user-select:none;touch-action:manipulation;}

#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}

#ui{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:clamp(16px,3.5vh,34px);
}

#title{
  font-size:clamp(.55rem,1.8vw,.72rem);
  letter-spacing:.5em;
  color:rgba(255,255,255,.16);
  text-align:center;
}

/* ── ORB ── */
#orb-wrap{
  position:relative;
  width:clamp(140px,40vw,220px);
  height:clamp(140px,40vw,220px);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ring{
  position:absolute;border-radius:50%;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  border:1px solid transparent;
  pointer-events:none;
}
.ring:nth-child(1){width:112%;height:112%;border-top-color:rgba(100,140,255,.22);animation:rs 9s linear infinite;}
.ring:nth-child(2){width:128%;height:128%;border-bottom-color:rgba(140,80,255,.15);animation:rs 15s linear infinite reverse;}
.ring:nth-child(3){width:145%;height:145%;border-right-color:rgba(80,180,255,.1);animation:rs 23s linear infinite;}
@keyframes rs{to{transform:translate(-50%,-50%) rotate(360deg);}}

#orb{
  width:76%;height:76%;
  border-radius:50%;
  position:relative;z-index:2;
  cursor:pointer;
  background:radial-gradient(circle at 36% 32%,#fff 0%,rgba(130,175,255,.84) 20%,rgba(55,95,255,.66) 50%,rgba(18,38,175,.44) 75%,transparent 100%);
  box-shadow:0 0 30px rgba(80,130,255,.72),0 0 80px rgba(40,75,255,.42),0 0 150px rgba(18,48,200,.17),inset 0 0 18px rgba(255,255,255,.06);
  animation:oi 3s ease-in-out infinite;
  transition:background .4s,box-shadow .4s;
}
@keyframes oi{0%,100%{transform:scale(1);}50%{transform:scale(1.05);filter:brightness(1.1);}}

#orb.listen{
  background:radial-gradient(circle at 36% 32%,#fff 0%,rgba(70,255,155,.88) 20%,rgba(0,195,95,.68) 50%,rgba(0,95,45,.4) 75%,transparent 100%);
  box-shadow:0 0 38px rgba(0,255,120,.9),0 0 90px rgba(0,195,75,.55),0 0 160px rgba(0,135,55,.22);
  animation:ol .44s ease-in-out infinite alternate;
}
@keyframes ol{from{transform:scale(.93);}to{transform:scale(1.18);filter:brightness(1.35);}}

#orb.think{
  background:radial-gradient(circle at 36% 32%,#fff 0%,rgba(255,205,55,.88) 20%,rgba(255,125,0,.68) 50%,rgba(175,45,0,.4) 75%,transparent 100%);
  box-shadow:0 0 38px rgba(255,165,0,.9),0 0 90px rgba(255,95,0,.55),0 0 160px rgba(195,55,0,.22);
  animation:ot .85s ease-in-out infinite alternate;
}
@keyframes ot{from{transform:scale(.97);}to{transform:scale(1.07);filter:brightness(1.22);}}

#orb.speak{
  background:radial-gradient(circle at 36% 32%,#fff 0%,rgba(255,95,255,.88) 20%,rgba(195,0,255,.68) 50%,rgba(95,0,175,.4) 75%,transparent 100%);
  box-shadow:0 0 38px rgba(215,75,255,.92),0 0 90px rgba(155,0,255,.58),0 0 160px rgba(95,0,195,.24);
  animation:os .26s ease-in-out infinite alternate;
}
@keyframes os{from{transform:scale(.89);}to{transform:scale(1.22);filter:brightness(1.55);}}

#status{
  font-size:clamp(.54rem,1.7vw,.68rem);
  letter-spacing:.28em;
  color:rgba(255,255,255,.28);
  text-align:center;
  min-height:1em;
  transition:color .3s;
}
#status.lit{color:rgba(255,255,255,.75);}

/* Debug bar — mostra tudo na tela */
#log{
  position:fixed;bottom:0;left:0;right:0;
  padding:7px 16px;
  font-size:clamp(.46rem,1.2vw,.56rem);
  letter-spacing:.05em;
  color:rgba(255,255,255,.28);
  background:rgba(0,0,0,.75);
  border-top:1px solid rgba(255,255,255,.06);
  z-index:99;text-align:center;
  word-break:break-all;
  transition:color .3s;
}
#log.ok{color:rgba(0,255,130,.6);}
#log.err{color:rgba(255,80,80,.85);}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="ui">
  <div id="title">J . A . R . V . I . S</div>
  <div id="orb-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div id="orb"></div>
  </div>
  <div id="status">TOQUE PARA FALAR</div>
</div>

<div id="log">Inicializando...</div>

<script>
/* ══ STARS ══════════════════════════════════════════ */
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d'),s=[];
  function init(){
    c.width=innerWidth;c.height=innerHeight;s=[];
    for(var i=0;i<Math.floor(innerWidth*innerHeight/2500);i++)
      s.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*.9+.1,p:Math.random()*6.28,sp:.002+Math.random()*.006});
  }
  function draw(){
    x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<s.length;i++){
      s[i].p+=s[i].sp;
      x.beginPath();x.arc(s[i].x,s[i].y,s[i].r,0,6.28);
      x.fillStyle='rgba(255,255,255,'+(0.1+0.6*Math.abs(Math.sin(s[i].p)))+')';
      x.fill();
    }
    requestAnimationFrame(draw);
  }
  init();window.addEventListener('resize',init);draw();
})();

/* ══ REFS ══════════════════════════════════════════ */
var orb   = document.getElementById('orb');
var stEl  = document.getElementById('status');
var logEl = document.getElementById('log');

/* ══ LOG ════════════════════════════════════════════ */
function log(msg, cls) {
  console.log('[JARVIS]', msg);
  logEl.textContent = msg;
  logEl.className = cls || '';
}

/* ══ STATE ══════════════════════════════════════════ */
var state   = 'idle';
var history = [];
var ttsOk   = false;

function setState(s) {
  state = s;
  orb.className = '';
  stEl.className = '';
  if (s === 'listen') { orb.classList.add('listen'); stEl.classList.add('lit'); stEl.textContent = 'OUVINDO...'; }
  else if (s === 'think') { orb.classList.add('think'); stEl.classList.add('lit'); stEl.textContent = 'PROCESSANDO...'; }
  else if (s === 'speak') { orb.classList.add('speak'); stEl.classList.add('lit'); stEl.textContent = 'J.A.R.V.I.S'; }
  else { stEl.textContent = 'TOQUE PARA FALAR'; }
}

/* ══ UNLOCK TTS — deve ser chamado dentro de gesto do usuário ══ */
function unlockTTS() {
  if (ttsOk || !window.speechSynthesis) return;
  var u = new SpeechSynthesisUtterance('');
  u.volume = 0; u.rate = 10;
  window.speechSynthesis.speak(u);
  ttsOk = true;
  log('TTS desbloqueado', 'ok');
}

/* ══ SPEAK ══════════════════════════════════════════ */
function speak(text) {
  if (!window.speechSynthesis) {
    log('Erro: browser não tem TTS. Use Chrome ou Safari.', 'err');
    setState('idle'); return;
  }

  window.speechSynthesis.cancel();
  var clean = text.replace(/<[^>]*>/g, '').replace(/[*_`#◈▸⚠]/g, '').replace(/\s+/g, ' ').trim();
  log('Falando: "' + clean.slice(0, 55) + (clean.length > 55 ? '…' : '') + '"', 'ok');

  function go() {
    var voices = window.speechSynthesis.getVoices();
    var u = new SpeechSynthesisUtterance(clean);
    u.lang = 'pt-BR'; u.rate = 0.88; u.pitch = 0.6; u.volume = 1;

    var best =
      voices.find(function(v) { return v.lang === 'pt-BR' && v.localService; }) ||
      voices.find(function(v) { return v.lang === 'pt-BR'; }) ||
      voices.find(function(v) { return v.lang.startsWith('pt'); });
    if (best) { u.voice = best; log('Voz: ' + best.name, 'ok'); }
    else { log('Aviso: sem voz pt-BR instalada, usando padrão do sistema'); }

    u.onstart = function() { setState('speak'); };
    u.onend   = function() { setState('idle'); log('Pronto — toque para falar', 'ok'); };
    u.onerror = function(e) {
      if (e.error === 'interrupted') return;
      log('Erro TTS: ' + e.error, 'err');
      setState('idle');
    };

    setState('speak');
    window.speechSynthesis.speak(u);
  }

  var v = window.speechSynthesis.getVoices();
  if (v.length) { go(); return; }
  var t = setTimeout(go, 600);
  window.speechSynthesis.onvoiceschanged = function() {
    clearTimeout(t);
    window.speechSynthesis.onvoiceschanged = null;
    go();
  };
}

/* ══ API ════════════════════════════════════════════ */
function ask(heard) {
  heard = (heard || '').trim();
  if (!heard || state === 'think') return;

  window.speechSynthesis && window.speechSynthesis.cancel();
  history.push({ role: 'user', content: heard });
  if (history.length > 20) history = history.slice(-20);
  setState('think');
  log('Enviando: "' + heard.slice(0, 45) + '"…');

  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: history.slice(-8) })
  })
  .then(function(r) {
    log('HTTP ' + r.status);
    return r.text().then(function(t) { return { s: r.status, t: t }; });
  })
  .then(function(r) {
    log('Raw: ' + r.t.slice(0, 70));
    var d;
    try { d = JSON.parse(r.t); } catch(e) { throw new Error('JSON inválido: ' + r.t.slice(0, 60)); }
    if (r.s !== 200) throw new Error(d.error || ('HTTP ' + r.s));
    var reply = (d.reply || '').trim();
    if (!reply) throw new Error('reply vazio. raw: ' + r.t.slice(0, 80));
    history.push({ role: 'assistant', content: reply });
    speak(reply);
  })
  .catch(function(e) {
    log('ERRO: ' + e.message, 'err');
    setState('idle');
  });
}

/* ══ RECONHECIMENTO DE VOZ ══════════════════════════ */
var recog = null;
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SR) {
  recog = new SR();
  recog.lang = 'pt-BR';
  recog.continuous = false;
  recog.interimResults = false;
  recog.maxAlternatives = 1;

  recog.onresult = function(e) {
    var heard = (e.results[0][0].transcript || '').trim();
    log('Ouvi: "' + heard + '"', 'ok');
    if (heard) ask(heard);
    else { log('Nenhuma voz detectada', 'err'); setState('idle'); }
  };

  recog.onerror = function(e) {
    if (e.error === 'aborted') return;
    if (e.error === 'not-allowed') log('MICROFONE BLOQUEADO — permita acesso ao mic nas configurações', 'err');
    else log('Erro microfone: ' + e.error, 'err');
    setState('idle');
  };

  recog.onend = function() {
    if (state === 'listen') setState('idle');
  };

  log('Pronto. Toque no orb para falar.', 'ok');
} else {
  log('Use Google Chrome — reconhecimento de voz não suportado neste browser', 'err');
}

/* ══ TOQUE NO ORB ══════════════════════════════════ */
var busy = false;
function onTap(e) {
  if (e) e.preventDefault();
  if (busy) return;
  busy = true; setTimeout(function() { busy = false; }, 400);

  unlockTTS(); // DEVE estar dentro do gesto do usuário

  if (state === 'speak') {
    window.speechSynthesis && window.speechSynthesis.cancel();
    setState('idle'); log('Cancelado');
    return;
  }
  if (state === 'think') { log('Aguarde, processando...'); return; }
  if (state === 'listen') {
    try { recog && recog.stop(); } catch(e) {}
    setState('idle'); log('Cancelado');
    return;
  }

  // idle → começar a ouvir
  if (!recog) { log('Use Google Chrome para reconhecimento de voz', 'err'); return; }
  window.speechSynthesis && window.speechSynthesis.cancel();

  try { recog.abort(); } catch(e) {}
  setTimeout(function() {
    try {
      recog.start();
      setState('listen');
      log('Fale agora...');
    } catch(err) {
      log('Erro ao iniciar microfone: ' + err.message, 'err');
      setState('idle');
    }
  }, 150);
}

orb.addEventListener('click', onTap);
orb.addEventListener('touchend', onTap, { passive: false });

/* ══ INIT VOICES ════════════════════════════════════ */
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
}

/* ══ TESTE API AO CARREGAR ══════════════════════════ */
window.addEventListener('load', function() {
  setTimeout(function() {
    log('Testando API...');
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: 'responda só: online' }] })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.reply) log('API OK ✓  — ' + d.reply.slice(0, 50), 'ok');
      else log('API respondeu sem reply: ' + JSON.stringify(d).slice(0, 80), 'err');
    })
    .catch(function(e) { log('API falhou: ' + e.message, 'err'); });
  }, 1500);
});
</script>
</body>
</html>
