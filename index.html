<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#000000"/>
<title>J.A.R.V.I.S</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; height:100%;
  background:#000;
  overflow:hidden;
  font-family: 'Courier New', monospace;
  color:#fff;
  user-select:none;
}

/* ── SPACE CANVAS ── */
#stars {
  position:fixed; inset:0; z-index:0; pointer-events:none;
}

/* ── CENTER STAGE ── */
#stage {
  position:fixed; inset:0; z-index:1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:0;
}

/* ── TITLE (small, top) ── */
#title {
  position:fixed; top:32px; left:50%; transform:translateX(-50%);
  font-size:clamp(0.7rem, 2.5vw, 0.85rem);
  letter-spacing:0.5em;
  color:rgba(255,255,255,0.25);
  z-index:10; white-space:nowrap;
}

/* ── THE ORB ── */
#orb-wrap {
  position:relative;
  width:clamp(180px,45vw,280px);
  height:clamp(180px,45vw,280px);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}

/* Outer glow rings */
.glow-ring {
  position:absolute; border-radius:50%;
  border:1px solid transparent;
  animation:ring-spin linear infinite;
  pointer-events:none;
}
.glow-ring:nth-child(1) {
  width:100%; height:100%;
  border-top-color:rgba(100,150,255,0.3);
  border-right-color:rgba(100,150,255,0.1);
  animation-duration:8s;
}
.glow-ring:nth-child(2) {
  width:115%; height:115%;
  border-bottom-color:rgba(150,100,255,0.2);
  animation-duration:14s;
  animation-direction:reverse;
}
.glow-ring:nth-child(3) {
  width:130%; height:130%;
  border-top-color:rgba(100,200,255,0.12);
  border-left-color:rgba(100,200,255,0.06);
  animation-duration:20s;
}

@keyframes ring-spin { to { transform:rotate(360deg); } }

/* The orb itself */
#orb {
  width:70%; height:70%;
  border-radius:50%;
  position:relative; z-index:2;
  cursor:pointer;
  transition:transform 0.3s ease;

  /* idle: cool blue-white */
  background: radial-gradient(circle at 35% 35%,
    rgba(255,255,255,0.9) 0%,
    rgba(120,180,255,0.8) 25%,
    rgba(60,100,255,0.6) 55%,
    rgba(20,40,150,0.4) 80%,
    transparent 100%
  );
  box-shadow:
    0 0 30px rgba(100,150,255,0.6),
    0 0 80px rgba(60,100,255,0.35),
    0 0 150px rgba(40,80,255,0.15),
    inset 0 0 30px rgba(255,255,255,0.1);

  animation: orb-idle 3s ease-in-out infinite;
}

#orb:active { transform: scale(0.92); }

@keyframes orb-idle {
  0%,100% { transform:scale(1);     filter:brightness(1); }
  50%      { transform:scale(1.06); filter:brightness(1.15); }
}

/* LISTENING — green pulse */
#orb.listening {
  background: radial-gradient(circle at 35% 35%,
    rgba(255,255,255,0.95) 0%,
    rgba(100,255,180,0.85) 25%,
    rgba(0,220,120,0.65) 55%,
    rgba(0,120,60,0.4) 80%,
    transparent 100%
  );
  box-shadow:
    0 0 40px rgba(0,255,150,0.8),
    0 0 100px rgba(0,200,100,0.5),
    0 0 200px rgba(0,150,80,0.25);
  animation: orb-listen 0.5s ease-in-out infinite alternate;
}
@keyframes orb-listen {
  from { transform:scale(0.95); filter:brightness(1); }
  to   { transform:scale(1.2);  filter:brightness(1.4); }
}

/* THINKING — amber/orange */
#orb.thinking {
  background: radial-gradient(circle at 35% 35%,
    rgba(255,255,255,0.95) 0%,
    rgba(255,210,80,0.85) 25%,
    rgba(255,140,0,0.65) 55%,
    rgba(180,60,0,0.4) 80%,
    transparent 100%
  );
  box-shadow:
    0 0 40px rgba(255,180,0,0.8),
    0 0 100px rgba(255,120,0,0.5),
    0 0 200px rgba(200,80,0,0.25);
  animation: orb-think 1s ease-in-out infinite alternate;
}
@keyframes orb-think {
  from { transform:scale(0.98); filter:brightness(1); }
  to   { transform:scale(1.08); filter:brightness(1.3); }
}

/* SPEAKING — purple/magenta */
#orb.speaking {
  background: radial-gradient(circle at 35% 35%,
    rgba(255,255,255,0.95) 0%,
    rgba(255,120,255,0.85) 25%,
    rgba(200,0,255,0.65) 55%,
    rgba(100,0,180,0.4) 80%,
    transparent 100%
  );
  box-shadow:
    0 0 40px rgba(220,100,255,0.8),
    0 0 100px rgba(180,0,255,0.5),
    0 0 200px rgba(120,0,200,0.25);
  animation: orb-speak 0.3s ease-in-out infinite alternate;
}
@keyframes orb-speak {
  from { transform:scale(0.92); filter:brightness(0.9); }
  to   { transform:scale(1.22); filter:brightness(1.5); }
}

/* ── STATUS LABEL ── */
#status {
  position:fixed; bottom:clamp(80px,15vh,120px); left:50%; transform:translateX(-50%);
  font-size:clamp(0.65rem,2vw,0.75rem);
  letter-spacing:0.3em;
  color:rgba(255,255,255,0.35);
  z-index:10;
  text-align:center;
  transition:color 0.4s, opacity 0.4s;
  white-space:nowrap;
}
#status.active { color:rgba(255,255,255,0.7); }

/* ── SUBTITLE / LAST RESPONSE (just 1 line, bottom) ── */
#last-response {
  position:fixed;
  bottom:clamp(38px,8vh,55px);
  left:50%; transform:translateX(-50%);
  width:90%; max-width:500px;
  font-size:clamp(0.6rem,1.5vw,0.7rem);
  letter-spacing:0.08em;
  color:rgba(255,255,255,0.2);
  text-align:center;
  z-index:10;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  transition:opacity 0.5s;
}

/* ── TAP HINT (disappears after first tap) ── */
#hint {
  position:fixed; bottom:clamp(18px,4vh,28px); left:50%; transform:translateX(-50%);
  font-size:clamp(0.55rem,1.3vw,0.62rem);
  letter-spacing:0.25em;
  color:rgba(255,255,255,0.15);
  z-index:10;
  animation:hint-blink 2s ease-in-out infinite;
  white-space:nowrap;
}
@keyframes hint-blink { 0%,100%{opacity:0.4} 50%{opacity:1} }

/* ── ERROR TOAST ── */
#toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  background:rgba(200,0,0,0.7);
  color:#fff; font-size:0.65rem; letter-spacing:0.12em;
  padding:8px 20px; border-radius:4px;
  z-index:100;
  opacity:0; transition:opacity 0.3s;
  pointer-events:none; white-space:nowrap;
}
#toast.show { opacity:1; }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="title">J . A . R . V . I . S</div>

<div id="stage">
  <div id="orb-wrap">
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>
    <div id="orb"></div>
  </div>
</div>

<div id="status">TOQUE PARA FALAR</div>
<div id="last-response"></div>
<div id="hint">↑ TOQUE NO ORB</div>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════
   STARS
══════════════════════════════════════════ */
(function(){
  var c = document.getElementById('stars');
  var ctx = c.getContext('2d');
  var stars = [];

  function resize(){
    c.width  = window.innerWidth;
    c.height = window.innerHeight;
    stars = [];
    var n = Math.floor((c.width * c.height) / 3000);
    for(var i=0;i<n;i++){
      stars.push({
        x: Math.random()*c.width,
        y: Math.random()*c.height,
        r: Math.random()*1.2,
        o: Math.random()*0.7+0.1,
        speed: Math.random()*0.003+0.001
      });
    }
  }

  var t = 0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    t += 0.01;
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var opacity = s.o * (0.5 + 0.5*Math.sin(t*s.speed*100 + i));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,'+opacity+')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener('resize', resize);
  draw();
})();

/* ══════════════════════════════════════════
   STATE MACHINE
══════════════════════════════════════════ */
var orb      = document.getElementById('orb');
var statusEl = document.getElementById('status');
var lastResp = document.getElementById('last-response');
var hintEl   = document.getElementById('hint');
var toastEl  = document.getElementById('toast');

var state = 'idle'; // idle | listening | thinking | speaking

function setState(s){
  state = s;
  orb.className = '';
  statusEl.className = '';

  if(s === 'idle'){
    statusEl.textContent = 'TOQUE PARA FALAR';
    hintEl.style.opacity = '1';
  } else if(s === 'listening'){
    orb.classList.add('listening');
    statusEl.classList.add('active');
    statusEl.textContent = 'OUVINDO...';
    hintEl.style.opacity = '0';
  } else if(s === 'thinking'){
    orb.classList.add('thinking');
    statusEl.classList.add('active');
    statusEl.textContent = 'PROCESSANDO...';
  } else if(s === 'speaking'){
    orb.classList.add('speaking');
    statusEl.classList.add('active');
    statusEl.textContent = 'J.A.R.V.I.S';
  }
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(function(){ toastEl.classList.remove('show'); }, 4000);
}

/* ══════════════════════════════════════════
   API
══════════════════════════════════════════ */
var history = [];

function askJarvis(text){
  if(state === 'thinking') return;

  // Stop any ongoing speech
  if('speechSynthesis' in window) window.speechSynthesis.cancel();

  history.push({ role:'user', content:text });
  if(history.length > 20) history = history.slice(-20);

  setState('thinking');

  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: history.slice(-10) })
  })
  .then(function(r){
    return r.json().then(function(d){
      if(!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
      return d;
    });
  })
  .then(function(data){
    var reply = (data.reply || '').trim();
    if(!reply) throw new Error('Resposta vazia');

    history.push({ role:'assistant', content:reply });
    lastResp.textContent = reply.slice(0, 80) + (reply.length > 80 ? '...' : '');
    speak(reply);
  })
  .catch(function(err){
    console.error('API error:', err);
    showToast('ERRO: ' + err.message);
    setState('idle');
  });
}

/* ══════════════════════════════════════════
   SPEECH SYNTHESIS (TTS)
══════════════════════════════════════════ */
function speak(text){
  if(!('speechSynthesis' in window)){
    setState('idle');
    return;
  }

  window.speechSynthesis.cancel();

  var clean = text
    .replace(/<[^>]+>/g,'')
    .replace(/[*_`#◈▸⚠]/g,'')
    .trim();

  function doSpeak(){
    var u = new SpeechSynthesisUtterance(clean);
    u.lang   = 'pt-BR';
    u.rate   = 0.9;
    u.pitch  = 0.65;
    u.volume = 1;

    var voices = window.speechSynthesis.getVoices();
    var voice = null;

    // Best voice priority
    voice = voices.find(function(v){ return v.lang === 'pt-BR' && v.localService && !v.name.includes('Google'); });
    if(!voice) voice = voices.find(function(v){ return v.lang === 'pt-BR'; });
    if(!voice) voice = voices.find(function(v){ return v.lang.startsWith('pt'); });
    if(voice) u.voice = voice;

    u.onstart = function(){ setState('speaking'); };
    u.onend   = function(){ setState('idle'); };
    u.onerror = function(e){
      if(e.error !== 'interrupted') setState('idle');
    };

    window.speechSynthesis.speak(u);
    setState('speaking');
  }

  // Ensure voices are loaded (Safari / iOS)
  var voices = window.speechSynthesis.getVoices();
  if(voices.length > 0){
    doSpeak();
  } else {
    window.speechSynthesis.onvoiceschanged = function(){
      window.speechSynthesis.onvoiceschanged = null;
      doSpeak();
    };
    // Fallback if event never fires
    setTimeout(doSpeak, 500);
  }
}

/* ══════════════════════════════════════════
   VOICE RECOGNITION
══════════════════════════════════════════ */
var recog   = null;
var isRec   = false;

if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recog  = new SR();
  recog.lang            = 'pt-BR';
  recog.continuous      = false;
  recog.interimResults  = false;
  recog.maxAlternatives = 1;

  recog.onresult = function(e){
    var heard = e.results[0][0].transcript.trim();
    if(heard) askJarvis(heard);
    else setState('idle');
  };

  recog.onerror = function(e){
    console.warn('Speech error:', e.error);
    isRec = false;
    if(e.error === 'not-allowed'){
      showToast('PERMISSÃO DO MICROFONE NEGADA');
    } else if(e.error !== 'aborted'){
      showToast('ERRO DE VOZ: ' + e.error);
    }
    setState('idle');
  };

  recog.onend = function(){
    isRec = false;
    if(state === 'listening') setState('thinking');
  };

  recog.onstart = function(){
    isRec = true;
  };

} else {
  showToast('USE CHROME OU SAFARI PARA VOZ');
}

/* ══════════════════════════════════════════
   ORB TAP
══════════════════════════════════════════ */
function orbTap(){
  hintEl.style.display = 'none';

  if(state === 'speaking'){
    // Stop speaking and go idle
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    setState('idle');
    return;
  }

  if(state === 'thinking') return;

  if(state === 'listening'){
    if(recog && isRec){ recog.stop(); }
    setState('idle');
    return;
  }

  // state === 'idle' → start listening
  if('speechSynthesis' in window) window.speechSynthesis.cancel();

  if(recog){
    try {
      recog.start();
      setState('listening');
    } catch(e){
      console.warn('recog start error:', e);
      // Already running, stop then restart
      recog.stop();
      setTimeout(function(){
        try { recog.start(); setState('listening'); } catch(e2){ console.warn(e2); }
      }, 300);
    }
  } else {
    showToast('VOZ NÃO DISPONÍVEL — USE CHROME');
  }
}

// Both click and touch
orb.addEventListener('click', orbTap);
orb.addEventListener('touchend', function(e){
  e.preventDefault();
  orbTap();
});

/* ══════════════════════════════════════════
   PRELOAD VOICES
══════════════════════════════════════════ */
if('speechSynthesis' in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function(){
    window.speechSynthesis.getVoices();
  };
}
</script>
</body>
</html>
