<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="description" content="Assistente de voz pessoal de Redzin"/>

<!-- PWA -->
<link rel="manifest" href="/manifest.json"/>

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="apple-touch-startup-image" href="/icon-512.png"/>

<!-- Android -->
<meta name="mobile-web-app-capable" content="yes"/>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>

<title>J.A.R.V.I.S</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;user-select:none;touch-action:manipulation;}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
#ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,30px);}
#title{font-size:clamp(.55rem,1.8vw,.7rem);letter-spacing:.5em;color:rgba(255,255,255,.15);text-align:center;}

/* ORB */
#wrap{position:relative;width:clamp(140px,42vw,224px);height:clamp(140px,42vw,224px);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.r{position:absolute;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);border:1px solid transparent;pointer-events:none;}
.r:nth-child(1){width:112%;height:112%;border-top-color:rgba(100,140,255,.22);animation:rs 9s linear infinite;}
.r:nth-child(2){width:128%;height:128%;border-bottom-color:rgba(140,80,255,.15);animation:rs 15s linear infinite reverse;}
.r:nth-child(3){width:145%;height:145%;border-right-color:rgba(80,180,255,.1);animation:rs 23s linear infinite;}
@keyframes rs{to{transform:translate(-50%,-50%) rotate(360deg);}}

#orb{width:76%;height:76%;border-radius:50%;cursor:pointer;z-index:2;
  background:radial-gradient(circle at 36% 32%,#fff 0%,rgba(130,175,255,.84) 20%,rgba(55,95,255,.66) 50%,rgba(18,38,175,.44) 75%,transparent 100%);
  box-shadow:0 0 30px rgba(80,130,255,.72),0 0 80px rgba(40,75,255,.42),0 0 150px rgba(18,48,200,.17);
  animation:oi 3s ease-in-out infinite;transition:background .4s,box-shadow .4s;}
@keyframes oi{0%,100%{transform:scale(1);}50%{transform:scale(1.05);filter:brightness(1.1);}}
#orb.L{background:radial-gradient(circle at 36% 32%,#fff 0%,rgba(70,255,155,.88) 20%,rgba(0,195,95,.68) 50%,rgba(0,95,45,.4) 75%,transparent 100%);box-shadow:0 0 40px rgba(0,255,120,.9),0 0 100px rgba(0,195,75,.55),0 0 180px rgba(0,135,55,.22);animation:oL .44s ease-in-out infinite alternate;}
@keyframes oL{from{transform:scale(.93);}to{transform:scale(1.18);filter:brightness(1.35);}}
#orb.T{background:radial-gradient(circle at 36% 32%,#fff 0%,rgba(255,205,55,.88) 20%,rgba(255,125,0,.68) 50%,rgba(175,45,0,.4) 75%,transparent 100%);box-shadow:0 0 40px rgba(255,165,0,.9),0 0 100px rgba(255,95,0,.55),0 0 180px rgba(195,55,0,.22);animation:oT .85s ease-in-out infinite alternate;}
@keyframes oT{from{transform:scale(.97);}to{transform:scale(1.07);filter:brightness(1.22);}}
#orb.S{background:radial-gradient(circle at 36% 32%,#fff 0%,rgba(255,95,255,.88) 20%,rgba(195,0,255,.68) 50%,rgba(95,0,175,.4) 75%,transparent 100%);box-shadow:0 0 40px rgba(215,75,255,.92),0 0 100px rgba(155,0,255,.58),0 0 180px rgba(95,0,195,.24);animation:oS .26s ease-in-out infinite alternate;}
@keyframes oS{from{transform:scale(.89);}to{transform:scale(1.22);filter:brightness(1.55);}}

#st{font-size:clamp(.54rem,1.7vw,.68rem);letter-spacing:.28em;color:rgba(255,255,255,.28);text-align:center;transition:color .3s;}
#st.on{color:rgba(255,255,255,.75);}


</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">J . A . R . V . I . S</div>
  <div id="wrap">
    <div class="r"></div><div class="r"></div><div class="r"></div>
    <div id="orb"></div>
  </div>
  <div id="st">TOQUE PARA FALAR</div>
</div>


<script>
/* STARS */
(function(){
  var c=document.getElementById('c'),x=c.getContext('2d'),s=[];
  function init(){c.width=innerWidth;c.height=innerHeight;s=[];for(var i=0,n=Math.floor(innerWidth*innerHeight/2500);i<n;i++)s.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*.85+.1,p:Math.random()*6.28,v:.002+Math.random()*.006});}
  function draw(){x.clearRect(0,0,c.width,c.height);for(var i=0;i<s.length;i++){s[i].p+=s[i].v;x.beginPath();x.arc(s[i].x,s[i].y,s[i].r,0,6.28);x.fillStyle='rgba(255,255,255,'+(0.1+0.6*Math.abs(Math.sin(s[i].p)))+')';x.fill();}requestAnimationFrame(draw);}
  init();window.addEventListener('resize',init);draw();
})();

/* STATE */
var orb=document.getElementById('orb');
var stEl=document.getElementById('st');
var state='idle', hist=[], ttsOn=false;

function L(m,t){console.log('[J]',m);}

function S(s){
  state=s;orb.className='';stEl.className='';
  if(s==='L'){orb.className='L';stEl.className='on';stEl.textContent='OUVINDO...';}
  else if(s==='T'){orb.className='T';stEl.className='on';stEl.textContent='PROCESSANDO...';}
  else if(s==='S'){orb.className='S';stEl.className='on';stEl.textContent='J.A.R.V.I.S';}
  else{stEl.textContent='TOQUE PARA FALAR';}
}

/* UNLOCK TTS — obrigatório dentro de gesto do usuário */
function uTTS(){
  if(ttsOn||!window.speechSynthesis)return;
  ttsOn=true;
}

/* SPEAK */
function speak(text){
  if(!window.speechSynthesis){L('Sem TTS. Use Chrome ou Safari.','er');S('idle');return;}
  if(window.speechSynthesis.speaking) window.speechSynthesis.cancel();
  var clean=text.replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
  L('Falando: "'+clean.slice(0,50)+'..."','ok');

  function go(){
    var vv=window.speechSynthesis.getVoices();
    var u=new SpeechSynthesisUtterance(clean);
    u.lang='pt-BR';u.rate=0.82;u.pitch=1.35;u.volume=1;
    var v=vv.find(function(v){return v.lang==='pt-BR'&&/female|feminino|luciana|vitoria|edith/i.test(v.name);})||
          vv.find(function(v){return v.lang==='pt-BR'&&v.localService;})||
          vv.find(function(v){return v.lang==='pt-BR';})||
          vv.find(function(v){return v.lang.startsWith('pt');});
    if(v)u.voice=v;
    u.onstart=function(){S('S');};
    u.onend=function(){S('idle');L('Pronto — toque para falar','ok');};
    u.onerror=function(e){if(e.error!=='interrupted'){L('Erro TTS: '+e.error,'er');S('idle');}};
    S('S');window.speechSynthesis.speak(u);
  }

  var vv=window.speechSynthesis.getVoices();
  if(vv.length){go();return;}
  var t=setTimeout(go,700);
  window.speechSynthesis.onvoiceschanged=function(){clearTimeout(t);window.speechSynthesis.onvoiceschanged=null;go();};
}

/* API */
function ask(heard){
  heard=(heard||'').trim();
  if(!heard||state==='T')return;
  if(window.speechSynthesis&&window.speechSynthesis.speaking) window.speechSynthesis.cancel();
  hist.push({role:'user',content:heard});
  if(hist.length>20)hist=hist.slice(-20);
  S('T');L('Enviando para API: "'+heard.slice(0,40)+'"');

  fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:hist.slice(-8)})
  })
  .then(function(r){
    L('HTTP '+r.status);
    return r.text().then(function(t){return{s:r.status,t:t};});
  })
  .then(function(r){
    L('Resposta raw: '+r.t.slice(0,80));
    var d;
    try{d=JSON.parse(r.t);}
    catch(e){throw new Error('JSON inválido: '+r.t.slice(0,60));}
    if(r.s!==200)throw new Error('Erro '+r.s+': '+(d.error||d.detail||r.t.slice(0,80)));
    var reply=(d.reply||'').trim();
    if(!reply)throw new Error('reply vazio: '+r.t.slice(0,80));
    hist.push({role:'assistant',content:reply});
    speak(reply);
  })
  .catch(function(e){L('ERRO: '+e.message,'er');S('idle');});
}

/* RECONHECIMENTO */
var recog=null, SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  recog=new SR();
  recog.lang='pt-BR';recog.continuous=false;recog.interimResults=false;recog.maxAlternatives=1;
  recog.onresult=function(e){
    var h=(e.results[0][0].transcript||'').trim();
    L('Ouvi: "'+h+'"','ok');
    if(h)ask(h);else{L('Nada ouvido','er');S('idle');}
  };
  recog.onerror=function(e){
    if(e.error==='not-allowed')L('MICROFONE BLOQUEADO — habilite o acesso nas configurações','er');
    else if(e.error!=='aborted')L('Erro mic: '+e.error,'er');
    S('idle');
  };
  recog.onend=function(){if(state==='L')S('idle');};
  L('Pronto. Toque no orb para falar.','ok');
}else{
  L('Use Google Chrome — voz não suportada neste browser','er');
}

/* TAP */
var busy=false;
function tap(e){
  if(e)e.preventDefault();
  if(busy)return;busy=true;setTimeout(function(){busy=false;},400);
  uTTS();
  if(state==='S'){window.speechSynthesis&&window.speechSynthesis.cancel();S('idle');return;}
  if(state==='T'){L('Aguarde...');return;}
  if(state==='L'){try{recog&&recog.stop();}catch(e){}S('idle');return;}
  if(!recog){L('Use Google Chrome','er');return;}
  if(window.speechSynthesis&&window.speechSynthesis.speaking) window.speechSynthesis.cancel();
  try{recog.abort();}catch(e){}
  setTimeout(function(){
    try{recog.start();S('L');L('Fale agora...');}
    catch(err){L('Erro ao abrir mic: '+err.message,'er');S('idle');}
  },150);
}
orb.addEventListener('click',tap);
orb.addEventListener('touchend',tap,{passive:false});

/* VOICES */
if(window.speechSynthesis){ window.speechSynthesis.getVoices(); }

/* TESTE AUTOMÁTICO DA API */
window.addEventListener('load',function(){
  setTimeout(function(){
    L('Testando /api/chat...');
    fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:'diga apenas: ok'}]})
    })
    .then(function(r){return r.text().then(function(t){return{s:r.status,t:t};});})
    .then(function(r){
      L('Teste API — HTTP '+r.s+' — '+r.t.slice(0,100), r.s===200?'ok':'er');
    })
    .catch(function(e){L('Teste API falhou: '+e.message,'er');});
  },1000);
});
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js')
      .then(function(r){ console.log('[SW] registrado:', r.scope); })
      .catch(function(e){ console.warn('[SW] erro:', e); });
  });
}
</script>
</body>
</html>
